name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - nightly

permissions:
  contents: write

jobs:
  test:
    name: Check & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --locked

  package-macos:
    name: Package macOS (${{ matrix.arch_label }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: arm64
          - target: x86_64-apple-darwin
            arch_label: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - name: Build .app, .dmg and .zip
        run: |
          chmod +x scripts/bundle-macos.sh
          ./scripts/bundle-macos.sh --target "${{ matrix.target }}" --arch-label "${{ matrix.arch_label }}" --package
          mkdir -p upload
          cp target/dist/*.dmg upload/
          cp target/dist/*.zip upload/
          cp target/${{ matrix.target }}/release/ai-switcher upload/ai-switcher
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch_label }}
          path: upload/*

  package-windows:
    name: Package Windows (x86_64)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build Windows portable zip and NSIS installer
        shell: pwsh
        run: |
          cargo build --release --locked
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path upload/staging | Out-Null
          Copy-Item target/release/ai-switcher.exe upload/staging/AI-Switcher.exe
          Copy-Item README.md upload/staging/README.md
          Compress-Archive -Path upload/staging/* -DestinationPath "upload/AI-Switcher-v${version}-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force upload/staging
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis -and (Test-Path "C:\Program Files\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis "/DAPP_VERSION=${version}" scripts/installer.nsi
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            upload/*.zip
            upload/*.exe

  package-linux:
    name: Package Linux (x86_64)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build Linux release tar.gz
        run: |
          cargo build --release --locked
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p upload/ai-switcher
          cp target/release/ai-switcher upload/ai-switcher/ai-switcher
          cp assets/app-icon.png upload/ai-switcher/ai-switcher.png
          cp README.md upload/ai-switcher/README.md
          tar -czf "upload/AI-Switcher-v${VERSION}-linux-x86_64.tar.gz" -C upload ai-switcher
          rm -rf upload/ai-switcher
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: upload/*.tar.gz

  release:
    name: Assemble Universal & Publish Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [package-macos, package-windows, package-linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Universal macOS, Checksums & Homebrew Cask
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets

          cp artifacts/macos-arm64/*.dmg release-assets/
          cp artifacts/macos-arm64/*.zip release-assets/
          cp artifacts/macos-x86_64/*.dmg release-assets/
          cp artifacts/macos-x86_64/*.zip release-assets/
          cp artifacts/windows-x86_64/*.zip release-assets/
          cp artifacts/windows-x86_64/*.exe release-assets/
          cp artifacts/linux-x86_64/*.tar.gz release-assets/

          # 合并生成 macOS Universal 通用包 (Apple Silicon + Intel)
          UNIVERSAL_APP="release-assets/AI Switcher.app"
          mkdir -p "$UNIVERSAL_APP/Contents/MacOS" "$UNIVERSAL_APP/Contents/Resources"
          lipo -create \
            artifacts/macos-arm64/ai-switcher \
            artifacts/macos-x86_64/ai-switcher \
            -output "$UNIVERSAL_APP/Contents/MacOS/ai-switcher"
          chmod +x "$UNIVERSAL_APP/Contents/MacOS/ai-switcher"
          cp assets/AppIcon.icns "$UNIVERSAL_APP/Contents/Resources/AppIcon.icns"

          cat > "$UNIVERSAL_APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>AI Switcher</string>
              <key>CFBundleDisplayName</key>
              <string>AI Switcher</string>
              <key>CFBundleIdentifier</key>
              <string>com.xwyin.ai-switcher</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleExecutable</key>
              <string>ai-switcher</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "$UNIVERSAL_APP" >/dev/null 2>&1 || true

          UNI_ZIP="AI-Switcher-v${VERSION}-macos-universal.zip"
          UNI_DMG="AI-Switcher-v${VERSION}-macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$UNIVERSAL_APP" "release-assets/$UNI_ZIP"

          mkdir -p dmg-staging
          cp -R "$UNIVERSAL_APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AI Switcher" -srcfolder dmg-staging -ov -format UDZO "release-assets/$UNI_DMG" >/dev/null
          rm -rf dmg-staging "$UNIVERSAL_APP"

          # 生成全平台 SHA256 校验文件
          (cd release-assets && shasum -a 256 *.dmg *.zip *.exe *.tar.gz > SHA256SUMS.txt)

          # 生成 Homebrew Cask 清单文件
          UNI_SHA=$(shasum -a 256 "release-assets/$UNI_DMG" | awk '{print $1}')
          cat > release-assets/ai-switcher.rb << EOF
          cask "ai-switcher" do
            version "${VERSION}"
            sha256 "${UNI_SHA}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${UNI_DMG}"
            name "AI Switcher"
            desc "Lightweight cross-platform account switcher and quota monitor for Codex & Antigravity built with GPUI"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "AI Switcher.app"
          end
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          name: "AI Switcher ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel != 'stable' || contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
            release-assets/ai-switcher.rb
