[package]
name = "ai-switcher"
version = "0.1.7"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
tray-icon = "0.21"
muda = "0.17"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
tray-icon = "0.21"
muda = "0.17"
keyring = { version = "3", features = ["windows-native"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
keyring = { version = "3", features = ["sync-secret-service"] }

[patch.crates-io]
xattr = { path = "patches/xattr" }
